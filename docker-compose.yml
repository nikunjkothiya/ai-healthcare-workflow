
services:
  postgres:
    image: postgres:15-alpine
    container_name: healthcare_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare
    ports:
      - "5434:5432"  # Changed to 5434 to avoid conflict
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - healthcare_network

  redis:
    image: redis:7-alpine
    container_name: healthcare_redis
    ports:
      - "6381:6379"  # Changed to 6381 to avoid conflict
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - healthcare_network

  whisper:
    build:
      context: ./ai/whisper
      dockerfile: Dockerfile
    container_name: healthcare_whisper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./models/whisper:/models/whisper
    networks:
      - healthcare_network
    command: >
      sh -c "
      MODEL_FILE=\"$${WHISPER_MODEL_PATH:-/models/whisper/ggml-small.en-q5_1.bin}\";
      if [ \"$$MODEL_FILE\" = \"/models/whisper/ggml-small.en-q5_1.bin\" ] && [ ! -f \"$$MODEL_FILE\" ]; then
        echo 'Default Whisper model not found. Downloading ggml-small.en-q5_1.bin...';
        mkdir -p /models/whisper;
        wget -q --show-progress -O /models/whisper/ggml-small.en-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin;
      fi;
      exec /whisper.cpp/build/bin/whisper-server --host 0.0.0.0 --port 9000 --inference-path /inference -m \"$$MODEL_FILE\" --language en --no-timestamps -t 4
      "

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    container_name: healthcare_kokoro
    command:
      - /app/.venv/bin/python
      - -m
      - uvicorn
      - api.src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8880"
      - --log-level
      - info
    ports:
      - "${KOKORO_PORT:-8880}:8880"
    environment:
      - KOKORO_VOICE=${KOKORO_VOICE:-af_bella}
      - KOKORO_LANG=${KOKORO_LANG:-en-us}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - healthcare_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare_backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4000}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-postgres}
      - DB_NAME=${DB_NAME:-healthcare}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-supersecret_change_in_production}
      - LLM_PROVIDER=openrouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_URL=${OPENROUTER_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-http://localhost:3000}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-Care Outreach Assistant}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-30000}
      - LLM_REALTIME_TIMEOUT_MS=${LLM_REALTIME_TIMEOUT_MS:-30000}
      - LLM_NUM_CTX=${LLM_NUM_CTX:-1024}
      - LLM_MAX_TOKENS_ANALYSIS=${LLM_MAX_TOKENS_ANALYSIS:-768}
      - LLM_NUM_CTX_ANALYSIS=${LLM_NUM_CTX_ANALYSIS:-4096}
      - LLM_ANALYSIS_TIMEOUT_MS=${LLM_ANALYSIS_TIMEOUT_MS:-120000}
      - ANALYSIS_MODEL_WAIT_TIMEOUT_MS=${ANALYSIS_MODEL_WAIT_TIMEOUT_MS:-180000}
      - LLM_ANALYSIS_TRANSCRIPT_MAX_CHARS=${LLM_ANALYSIS_TRANSCRIPT_MAX_CHARS:-18000}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret}
      - WHISPER_HOST=${WHISPER_HOST:-whisper}
      - WHISPER_PORT=${WHISPER_PORT:-9000}
      - WHISPER_MODEL_PATH=${WHISPER_MODEL_PATH:-/models/whisper/ggml-small.en-q5_1.bin}
      - KOKORO_HOST=${KOKORO_HOST:-kokoro}
      - KOKORO_PORT=${KOKORO_PORT:-8880}
      - KOKORO_VOICE=${KOKORO_VOICE:-af_bella}
      - KOKORO_LANG=${KOKORO_LANG:-en-us}
      - RING_TIMEOUT_MS=${RING_TIMEOUT_MS:-30000}
      - WEBSOCKET_CALL_MAX_WAIT_MS=${WEBSOCKET_CALL_MAX_WAIT_MS:-720000}
      - POST_CALL_ANALYSIS_MAX_WAIT_MS=${POST_CALL_ANALYSIS_MAX_WAIT_MS:-90000}
      - MAX_CALL_DURATION_MS=${MAX_CALL_DURATION_MS:-600000}
      - MAX_CONVERSATION_TURNS=${MAX_CONVERSATION_TURNS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kokoro:
        condition: service_healthy
      whisper:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - healthcare_network

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: healthcare_worker
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-postgres}
      - DB_NAME=${DB_NAME:-healthcare}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - LLM_PROVIDER=openrouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_URL=${OPENROUTER_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-http://localhost:3000}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-Care Outreach Assistant}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-30000}
      - LLM_NUM_CTX=${LLM_NUM_CTX:-1024}
      - LLM_MAX_TOKENS_ANALYSIS=${LLM_MAX_TOKENS_ANALYSIS:-768}
      - LLM_NUM_CTX_ANALYSIS=${LLM_NUM_CTX_ANALYSIS:-4096}
      - LLM_ANALYSIS_TIMEOUT_MS=${LLM_ANALYSIS_TIMEOUT_MS:-120000}
      - ANALYSIS_MODEL_WAIT_TIMEOUT_MS=${ANALYSIS_MODEL_WAIT_TIMEOUT_MS:-180000}
      - LLM_ANALYSIS_TRANSCRIPT_MAX_CHARS=${LLM_ANALYSIS_TRANSCRIPT_MAX_CHARS:-18000}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-1}
      - CALL_SPACING_MS=${CALL_SPACING_MS:-15000}
      - RING_TIMEOUT_MS=${RING_TIMEOUT_MS:-30000}
      - WEBSOCKET_CALL_MAX_WAIT_MS=${WEBSOCKET_CALL_MAX_WAIT_MS:-720000}
      - POST_CALL_ANALYSIS_MAX_WAIT_MS=${POST_CALL_ANALYSIS_MAX_WAIT_MS:-90000}
      - MAX_CALL_DURATION_MS=${MAX_CALL_DURATION_MS:-600000}
      - MAX_CONVERSATION_TURNS=${MAX_CONVERSATION_TURNS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whisper:
        condition: service_healthy
    volumes:
      - ./ai/sample_audio:/sample_audio
    deploy:
      resources:
        limits:
          memory: 256M
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - healthcare_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcare_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:4000}
      - VITE_WS_URL=${VITE_WS_URL:-ws://localhost:4000}
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - healthcare_network

  livekit:
    image: livekit/livekit-server:latest
    container_name: healthcare_livekit
    command: --config /livekit.yaml
    ports:
      - "7800:7800"
      - "50000-50050:50000-50050/udp"
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - healthcare_network

  livekit-agent:
    build:
      context: ./livekit-agent
      dockerfile: Dockerfile
    container_name: healthcare_livekit_agent
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://livekit:7800}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - WHISPER_HOST=${WHISPER_HOST:-whisper}
      - WHISPER_PORT=${WHISPER_PORT:-9000}
      - KOKORO_HOST=${KOKORO_HOST:-kokoro}
      - KOKORO_PORT=${KOKORO_PORT:-8880}
      - BACKEND_URL=${BACKEND_URL:-http://backend:4000}
    depends_on:
      - livekit
      - whisper
      - kokoro
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - healthcare_network

volumes:
  postgres_data:

networks:
  healthcare_network:
    driver: bridge
