
services:
  postgres:
    image: postgres:15-alpine
    container_name: healthcare_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare
    ports:
      - "5434:5432"  # Changed to 5434 to avoid conflict
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - healthcare_network

  redis:
    image: redis:7-alpine
    container_name: healthcare_redis
    ports:
      - "6381:6379"  # Changed to 6381 to avoid conflict
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - healthcare_network

  whisper:
    build:
      context: ./ai/whisper
      dockerfile: Dockerfile
    container_name: healthcare_whisper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./models/whisper:/models/whisper
    networks:
      - healthcare_network
    command: >
      /whisper.cpp/build/bin/whisper-server --host 0.0.0.0 --port 9000 --inference-path /inference -m ${WHISPER_MODEL_PATH:-/models/whisper/ggml-small.en-q5_1.bin} --language en --no-timestamps -t 4

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    container_name: healthcare_kokoro
    command:
      - /app/.venv/bin/python
      - -m
      - uvicorn
      - api.src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8880"
      - --log-level
      - info
    ports:
      - "${KOKORO_PORT:-8880}:8880"
    environment:
      - KOKORO_VOICE=${KOKORO_VOICE:-af_bella}
      - KOKORO_LANG=${KOKORO_LANG:-en-us}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M
    networks:
      - healthcare_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare_backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4000}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-postgres}
      - DB_NAME=${DB_NAME:-healthcare}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-supersecret_change_in_production}
      - LLM_PROVIDER=openrouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_URL=${OPENROUTER_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-http://localhost:3000}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-Care Outreach Assistant}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - OPENROUTER_MODEL_CHAT=${OPENROUTER_MODEL_CHAT:-}
      - OPENROUTER_MODEL_REALTIME=${OPENROUTER_MODEL_REALTIME:-}
      - OPENROUTER_MODEL_DECISION=${OPENROUTER_MODEL_DECISION:-}
      - OPENROUTER_MODEL_ANALYSIS=${OPENROUTER_MODEL_ANALYSIS:-}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-15000}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-1}
      - LLM_RETRY_DELAY_MS=${LLM_RETRY_DELAY_MS:-800}
      - LLM_REALTIME_TIMEOUT_MS=${LLM_REALTIME_TIMEOUT_MS:-8000}
      - LLM_REALTIME_MAX_RETRIES=${LLM_REALTIME_MAX_RETRIES:-0}
      - LLM_FAILURE_HANDOFF=${LLM_FAILURE_HANDOFF:-true}
      - CALL_SPACING_MS=${CALL_SPACING_MS:-15000}
      - RING_TIMEOUT_MS=${RING_TIMEOUT_MS:-30000}
      - AUDIO_TMP_DIR=${AUDIO_TMP_DIR:-/tmp/healthcare_audio}
      - WHISPER_HOST=${WHISPER_HOST:-whisper}
      - WHISPER_PORT=${WHISPER_PORT:-9000}
      - WHISPER_MODEL_PATH=${WHISPER_MODEL_PATH:-/models/whisper/ggml-small.en-q5_1.bin}
      - VAD_MODEL_PATH=${VAD_MODEL_PATH:-/models/vad/silero_vad_op18_ifless.onnx}
      - KOKORO_HOST=${KOKORO_HOST:-kokoro}
      - KOKORO_PORT=${KOKORO_PORT:-8880}
      - KOKORO_VOICE=${KOKORO_VOICE:-af_bella}
      - KOKORO_LANG=${KOKORO_LANG:-en-us}
      - REQUIRE_SERVER_TTS=${REQUIRE_SERVER_TTS:-true}
      - STT_CHUNK_MS=${STT_CHUNK_MS:-1200}
      - STT_CHUNK_OVERLAP_MS=${STT_CHUNK_OVERLAP_MS:-200}
      - STT_REALTIME_CHUNK_MS=${STT_REALTIME_CHUNK_MS:-1000}
      - STT_REALTIME_SPLIT=${STT_REALTIME_SPLIT:-false}
      - STT_REALTIME_SPLIT_THRESHOLD_MS=${STT_REALTIME_SPLIT_THRESHOLD_MS:-15000}
      - STT_SILENCE_MS=${STT_SILENCE_MS:-500}
      - STT_VAD_SILENCE_RMS=${STT_VAD_SILENCE_RMS:-0.005}
      - STT_MAX_CONCURRENT=${STT_MAX_CONCURRENT:-3}
      - ASSISTANT_SPEECH_GUARD_MS=${ASSISTANT_SPEECH_GUARD_MS:-350}
      - MAX_CALL_DURATION_MS=${MAX_CALL_DURATION_MS:-600000}
      - MAX_CONVERSATION_TURNS=${MAX_CONVERSATION_TURNS:-30}
      - MAX_RUNTIME_RAM_GB=${MAX_RUNTIME_RAM_GB:-14}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kokoro:
        condition: service_healthy
      whisper:
        condition: service_healthy
    volumes:
      - ./models/vad:/models/vad:ro
    deploy:
      resources:
        limits:
          memory: 256M
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - healthcare_network

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: healthcare_worker
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-postgres}
      - DB_NAME=${DB_NAME:-healthcare}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - LLM_PROVIDER=openrouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_URL=${OPENROUTER_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-http://localhost:3000}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-Care Outreach Assistant}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - OPENROUTER_MODEL_CHAT=${OPENROUTER_MODEL_CHAT:-}
      - OPENROUTER_MODEL_REALTIME=${OPENROUTER_MODEL_REALTIME:-}
      - OPENROUTER_MODEL_DECISION=${OPENROUTER_MODEL_DECISION:-}
      - OPENROUTER_MODEL_ANALYSIS=${OPENROUTER_MODEL_ANALYSIS:-}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-15000}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-1}
      - LLM_RETRY_DELAY_MS=${LLM_RETRY_DELAY_MS:-800}
      - LLM_REALTIME_TIMEOUT_MS=${LLM_REALTIME_TIMEOUT_MS:-8000}
      - LLM_REALTIME_MAX_RETRIES=${LLM_REALTIME_MAX_RETRIES:-0}
      - LLM_FAILURE_HANDOFF=${LLM_FAILURE_HANDOFF:-true}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-1}
      - CALL_SPACING_MS=${CALL_SPACING_MS:-15000}
      - WEBSOCKET_CALL_MAX_WAIT_MS=${WEBSOCKET_CALL_MAX_WAIT_MS:-720000}
      - POST_CALL_ANALYSIS_MAX_WAIT_MS=${POST_CALL_ANALYSIS_MAX_WAIT_MS:-90000}
      - WHISPER_HOST=${WHISPER_HOST:-whisper}
      - WHISPER_PORT=${WHISPER_PORT:-9000}
      - WHISPER_MODEL_PATH=${WHISPER_MODEL_PATH:-/models/whisper/ggml-small.en-q5_1.bin}
      - VAD_MODEL_PATH=${VAD_MODEL_PATH:-/models/vad/silero_vad_op18_ifless.onnx}
      - KOKORO_HOST=${KOKORO_HOST:-kokoro}
      - KOKORO_PORT=${KOKORO_PORT:-8880}
      - KOKORO_VOICE=${KOKORO_VOICE:-af_bella}
      - KOKORO_LANG=${KOKORO_LANG:-en-us}
      - REQUIRE_SERVER_TTS=${REQUIRE_SERVER_TTS:-true}
      - STT_CHUNK_MS=${STT_CHUNK_MS:-1200}
      - STT_CHUNK_OVERLAP_MS=${STT_CHUNK_OVERLAP_MS:-200}
      - STT_REALTIME_SPLIT=${STT_REALTIME_SPLIT:-false}
      - STT_REALTIME_SPLIT_THRESHOLD_MS=${STT_REALTIME_SPLIT_THRESHOLD_MS:-15000}
      - STT_SILENCE_MS=${STT_SILENCE_MS:-500}
      - STT_VAD_SILENCE_RMS=${STT_VAD_SILENCE_RMS:-0.005}
      - STT_MAX_CONCURRENT=${STT_MAX_CONCURRENT:-3}
      - MAX_RUNTIME_RAM_GB=${MAX_RUNTIME_RAM_GB:-14}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whisper:
        condition: service_healthy
    volumes:
      - ./ai/sample_audio:/sample_audio
      - ./models/vad:/models/vad:ro
    deploy:
      resources:
        limits:
          memory: 256M
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - healthcare_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: healthcare_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:4000
      - VITE_WS_URL=ws://localhost:4000
      - VITE_REQUIRE_SERVER_TTS=${VITE_REQUIRE_SERVER_TTS:-true}
      - VITE_VAD_SPEECH_THRESHOLD=${VITE_VAD_SPEECH_THRESHOLD:-0.007}
      - VITE_VAD_SILENCE_THRESHOLD=${VITE_VAD_SILENCE_THRESHOLD:-0.0035}
      - VITE_VAD_MIN_SPEECH_MS=${VITE_VAD_MIN_SPEECH_MS:-300}
      - VITE_VAD_END_SILENCE_MS=${VITE_VAD_END_SILENCE_MS:-650}
      - VITE_VAD_MAX_UTTERANCE_MS=${VITE_VAD_MAX_UTTERANCE_MS:-8000}
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - healthcare_network

volumes:
  postgres_data:

networks:
  healthcare_network:
    driver: bridge
